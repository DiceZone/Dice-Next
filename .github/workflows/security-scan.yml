name: Security Scan

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # gitleaks-action 现在强制要求 license；改用开源 CLI 直接扫描（无需 license）。
      - name: Install gitleaks CLI
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
      - name: Run Gitleaks
        run: gitleaks detect --source . --redact --verbose --no-banner --config .gitleaks.toml

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/cwe-top-25 p/owasp-top-ten

  deps:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
