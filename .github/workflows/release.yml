name: Release Dice!Next

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            triplet: x64-linux-dynamic
            build_dir: build
          - arch: arm64
            runner: ubuntu-24.04-arm
            triplet: arm64-linux-dynamic
            build_dir: build-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          repository: DiceZone/onedice-cpp-lib
          path: onedice-cpp-lib
          token: ${{ secrets.DICEZONE_CI_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: DiceZone/Dice-Next-WebUI
          path: web
          token: ${{ secrets.DICEZONE_CI_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: DiceZone/Dice-Next-Doc
          path: docs
          token: ${{ secrets.DICEZONE_CI_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build WebUI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl zip unzip tar pkg-config libssl-dev libsqlite3-dev
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('main/server/vcpkg.json') }}
      - name: Build server
        working-directory: main
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          if [ ! -d "$VCPKG_ROOT/.git" ]; then git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"; fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root=server --triplet=${{ matrix.triplet }}
          cmake -S server -B server/${{ matrix.build_dir }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build server/${{ matrix.build_dir }} --parallel "$(nproc)"
      - name: Package
        working-directory: main
        env:
          DICENEXT_WEB_ROOT: ${{ github.workspace }}/web
          DICENEXT_DOC_ROOT: ${{ github.workspace }}/docs
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          chmod +x cross-compile/scripts/package-linux.sh
          cross-compile/scripts/package-linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: DiceNext-linux-${{ matrix.arch }}
          path: main/release/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2022
            triplet: x64-windows-dynamic
            build_dir: build
          - arch: arm64
            runner: windows-11-arm
            triplet: arm64-windows-dynamic
            build_dir: build-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          repository: DiceZone/onedice-cpp-lib
          path: onedice-cpp-lib
          token: ${{ secrets.DICEZONE_CI_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: DiceZone/Dice-Next-WebUI
          path: web
          token: ${{ secrets.DICEZONE_CI_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: DiceZone/Dice-Next-Doc
          path: docs
          token: ${{ secrets.DICEZONE_CI_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build WebUI
        shell: pwsh
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('main/server/vcpkg.json') }}
      - name: Build server
        shell: pwsh
        working-directory: main
        run: |
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          if (-not (Test-Path (Join-Path $vcpkg '.git'))) { git clone https://github.com/microsoft/vcpkg.git $vcpkg }
          & (Join-Path $vcpkg 'bootstrap-vcpkg.bat')
          & (Join-Path $vcpkg 'vcpkg.exe') install --x-manifest-root=server --triplet=${{ matrix.triplet }}
          cmake -S server -B server/${{ matrix.build_dir }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build server/${{ matrix.build_dir }} --config Release --parallel
      - name: Package
        shell: pwsh
        working-directory: main
        env:
          DICENEXT_WEB_ROOT: ${{ github.workspace }}\web
          DICENEXT_DOC_ROOT: ${{ github.workspace }}\docs
        run: .\cross-compile\scripts\package-windows.ps1 -Architecture '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: DiceNext-windows-${{ matrix.arch }}
          path: main/release/*.zip
          if-no-files-found: error

  macos-arm64:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          repository: DiceZone/onedice-cpp-lib
          path: onedice-cpp-lib
          token: ${{ secrets.DICEZONE_CI_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: DiceZone/Dice-Next-WebUI
          path: web
          token: ${{ secrets.DICEZONE_CI_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: DiceZone/Dice-Next-Doc
          path: docs
          token: ${{ secrets.DICEZONE_CI_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build WebUI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-arm64-osx-dynamic-${{ hashFiles('main/server/vcpkg.json') }}
      - name: Build server
        working-directory: main
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          if [ ! -d "$VCPKG_ROOT/.git" ]; then git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"; fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          "$VCPKG_ROOT/vcpkg" install --x-manifest-root=server --triplet=arm64-osx-dynamic
          cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=arm64-osx-dynamic
          cmake --build server/build --parallel "$(sysctl -n hw.ncpu)"
      - name: Package
        working-directory: main
        env:
          DICENEXT_WEB_ROOT: ${{ github.workspace }}/web
          DICENEXT_DOC_ROOT: ${{ github.workspace }}/docs
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          chmod +x cross-compile/scripts/package-macos.sh
          cross-compile/scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DiceNext-macos-arm64
          path: main/release/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [linux, windows, macos-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
