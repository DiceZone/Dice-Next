name: Release Dice!Next

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '26.x'
  # Keep the vcpkg executable aligned with server/vcpkg.json's builtin-baseline.
  VCPKG_BASELINE: '44819aa2a6c10e56065e2b0330e7d6c89d1d2574'

# Builds are serialized so a successful run can persist its number before the
# next run calculates its own number.
concurrency:
  group: dice-next-release
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend tests (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Linux compiles through ccache; Windows (MSVC) cannot cache precompiled-
      # header compilations, so it relies on the precompiled header alone.
      # No CCACHE_BASEDIR: it rewrites __FILE__ to relative paths, and tests
      # locate server/i18n from __FILE__.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 1G
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-2022
            triplet: x64-windows
          - os: Linux
            runner: ubuntu-24.04
            triplet: x64-linux-dynamic
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Checkout expression engines
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for repo in onedice-cpp-lib dicescript-c-lib CatOfficial; do
            for attempt in 1 2 3; do
              if git clone --depth 1 "https://github.com/DiceZone/${repo}.git" "$repo"; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 15
            done
            [ -d "$repo/.git" ] || exit 1
          done
      - name: Test Release automation
        shell: bash
        working-directory: main
        run: |
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          "$py" -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
      - name: Verify MCP test runtime
        working-directory: main
        run: node tools/check-node-version.mjs
      - name: Install locked official MCP test clients
        working-directory: main/tools/mcp-interop
        run: npm ci --ignore-scripts
      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl zip unzip tar pkg-config libssl-dev libsqlite3-dev ccache
      - name: Restore compiler cache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-tests-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-tests-linux-amd64-
      - name: Prepare dependencies
        uses: ./main/.github/actions/setup-vcpkg
        with:
          triplet: ${{ matrix.triplet }}
          baseline: ${{ env.VCPKG_BASELINE }}
      - name: Configure tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: main
        run: |
          cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DDICENEXT_MCP_INTEROP=ON -DDICENEXT_MSVC_COMPILE_PROCESSES=4 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_INSTALLED_DIR="$env:VCPKG_ROOT/installed"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
      - name: Configure tests (Linux)
        if: runner.os == 'Linux'
        working-directory: main
        run: |
          cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DDICENEXT_MCP_INTEROP=ON -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_INSTALLED_DIR="$VCPKG_ROOT/installed" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Compile tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: main
        run: |
          cmake --build server/build --config Release --target dice-next-tests --parallel 1
          if ($LASTEXITCODE -ne 0) { throw 'Test build failed' }
      - name: Compile tests (Linux)
        if: runner.os == 'Linux'
        working-directory: main
        run: |
          ccache --zero-stats
          cmake --build server/build --target dice-next-tests --parallel 2
          ccache --show-stats
      - name: Run backend tests
        shell: bash
        working-directory: main
        run: ctest --test-dir server/build -C Release --output-on-failure --no-tests=error --parallel 1 --timeout 900
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics-${{ matrix.os }}
          path: |
            main/server/build/Testing/Temporary/
            main/server/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  webui:
    name: WebUI
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - uses: actions/checkout@v4
        with:
          repository: DiceZone/Dice-Next-WebUI
          # Pair the android branch with WebUI/android (safe-area, jump login, passwordless).
          ref: ${{ github.ref_name == 'android' && 'android' || 'main' }}
          path: web
          token: ${{ secrets.DICEZONE_CI_TOKEN || github.token }}
      - name: Record WebUI build source
        id: source
        working-directory: web
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build WebUI
        working-directory: web
        run: |
          node scripts/check-node-version.mjs
          npm ci
          npm test
          npm run quality
          npm run build
          # Relative assets keep reverse-proxy prefixes working.
          if grep -Eq '(src|href)="/assets/' dist/index.html; then echo "WebUI must be built with Vite base './'" >&2; exit 1; fi
      - name: Test pages, themes and interactions in Chromium
        working-directory: web
        run: |
          npx --no-install playwright install --with-deps chromium --only-shell
          npm run test:v2-browser
          npm run test:notice-browser
          npm run test:mcp-browser
      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webui-browser-diagnostics
          path: web/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: web/dist
          if-no-files-found: error
  linux:
    name: Linux (${{ matrix.arch }})
    needs: webui
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            triplet: x64-linux-dynamic
            build_dir: build
          - arch: arm64
            runner: ubuntu-24.04-arm
            triplet: arm64-linux-dynamic
            build_dir: build-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Checkout onedice-cpp-lib (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf onedice-cpp-lib
            if git clone --depth 1 https://github.com/DiceZone/onedice-cpp-lib.git onedice-cpp-lib; then
              break
            fi
            echo "onedice-cpp-lib clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d onedice-cpp-lib/.git ] || { echo "onedice-cpp-lib clone failed after 3 attempts" >&2; exit 1; }
      - name: Checkout dicescript-c-lib (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf dicescript-c-lib
            if git clone --depth 1 https://github.com/DiceZone/dicescript-c-lib.git dicescript-c-lib; then
              break
            fi
            echo "dicescript-c-lib clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d dicescript-c-lib/.git ] || { echo "dicescript-c-lib clone failed after 3 attempts" >&2; exit 1; }
      - name: Checkout CatOfficial (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf CatOfficial
            if git clone --depth 1 https://github.com/DiceZone/CatOfficial.git CatOfficial; then
              break
            fi
            echo "CatOfficial clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d CatOfficial/.git ] || { echo "CatOfficial clone failed after 3 attempts" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: web/dist
      - name: Checkout docs (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf docs
            if git clone --depth 1 https://github.com/DiceZone/Dice-Next-Doc.git docs; then
              break
            fi
            echo "Dice-Next-Doc clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d docs/.git ] || { echo "Dice-Next-Doc clone failed after 3 attempts" >&2; exit 1; }
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl zip unzip tar pkg-config libssl-dev libsqlite3-dev
      - name: Prepare dependencies
        uses: ./main/.github/actions/setup-vcpkg
        with:
          triplet: ${{ matrix.triplet }}
          baseline: ${{ env.VCPKG_BASELINE }}
      - name: Configure release
        working-directory: main
        run: |
          cmake -S server -B server/${{ matrix.build_dir }} -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_INSTALLED_DIR="$VCPKG_ROOT/installed"
      - name: Compile release
        working-directory: main
        run: cmake --build server/${{ matrix.build_dir }} --parallel "$(nproc)"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
      - name: Verify Node.js security baseline
        working-directory: main
        shell: bash
        run: |
          node tools/check-node-version.mjs
          node --test tools/check-node-version.test.mjs
      - name: Test POSIX package manager
        working-directory: main
        run: |
          cmake --build server/${{ matrix.build_dir }} --target dice-next-update-test-core --parallel 2
          node tools/test-posix-manager.mjs server/${{ matrix.build_dir }}/dice-next server/${{ matrix.build_dir }}/dice-next-update-test-core
      - name: Package
        working-directory: main
        env:
          DICENEXT_WEB_ROOT: ${{ github.workspace }}/web
          DICENEXT_DOC_ROOT: ${{ github.workspace }}/docs
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          chmod +x cross-compile/scripts/package-linux.sh
          cross-compile/scripts/package-linux.sh ${{ matrix.arch }}
      - name: Test packaged WebUI HTTP
        timeout-minutes: 5
        working-directory: main
        run: node tools/test-webui-package.mjs release
      - uses: actions/upload-artifact@v4
        with:
          name: DiceNext-linux-${{ matrix.arch }}
          path: main/release/*.tar.gz
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-linux-${{ matrix.arch }}
          path: |
            main/server/**/vcpkg-manifest-install.log
            main/server/**/CMakeError.log
          if-no-files-found: ignore

  windows:
    name: Windows (${{ matrix.arch }})
    needs: webui
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2022
            triplet: x64-windows
            build_dir: build
          - arch: arm64
            runner: windows-11-arm
            triplet: arm64-windows
            build_dir: build-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Test Windows ZIP extraction
        shell: pwsh
        working-directory: main
        run: ./tools/test-release-zip.ps1
      - name: Checkout onedice-cpp-lib (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf onedice-cpp-lib
            if git clone --depth 1 https://github.com/DiceZone/onedice-cpp-lib.git onedice-cpp-lib; then
              break
            fi
            echo "onedice-cpp-lib clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d onedice-cpp-lib/.git ] || { echo "onedice-cpp-lib clone failed after 3 attempts" >&2; exit 1; }
      - name: Checkout dicescript-c-lib (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf dicescript-c-lib
            if git clone --depth 1 https://github.com/DiceZone/dicescript-c-lib.git dicescript-c-lib; then
              break
            fi
            echo "dicescript-c-lib clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d dicescript-c-lib/.git ] || { echo "dicescript-c-lib clone failed after 3 attempts" >&2; exit 1; }
      - name: Checkout CatOfficial (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf CatOfficial
            if git clone --depth 1 https://github.com/DiceZone/CatOfficial.git CatOfficial; then
              break
            fi
            echo "CatOfficial clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d CatOfficial/.git ] || { echo "CatOfficial clone failed after 3 attempts" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: web/dist
      - name: Checkout docs (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf docs
            if git clone --depth 1 https://github.com/DiceZone/Dice-Next-Doc.git docs; then
              break
            fi
            echo "Dice-Next-Doc clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d docs/.git ] || { echo "Dice-Next-Doc clone failed after 3 attempts" >&2; exit 1; }

      - name: Prepare dependencies
        uses: ./main/.github/actions/setup-vcpkg
        with:
          triplet: ${{ matrix.triplet }}
          baseline: ${{ env.VCPKG_BASELINE }}
      - name: Configure release
        shell: pwsh
        working-directory: main
        run: |
          cmake -S server -B server/${{ matrix.build_dir }} -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DDICENEXT_MSVC_COMPILE_PROCESSES=2 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_INSTALLED_DIR="$env:VCPKG_ROOT/installed"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
      - name: Compile release
        shell: pwsh
        working-directory: main
        run: |
          # One MSBuild project x two compiler processes bounds peak memory usage.
          cmake --build server/${{ matrix.build_dir }} --config Release --parallel 1
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
      - name: Package
        shell: pwsh
        working-directory: main
        env:
          DICENEXT_WEB_ROOT: ${{ github.workspace }}\web
          DICENEXT_DOC_ROOT: ${{ github.workspace }}\docs
        run: .\cross-compile\scripts\package-windows.ps1 -Architecture '${{ matrix.arch }}'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
      - name: Test packaged WebUI HTTP
        timeout-minutes: 5
        working-directory: main
        run: node tools/test-webui-package.mjs release
      - uses: actions/upload-artifact@v4
        with:
          name: DiceNext-windows-${{ matrix.arch }}
          path: main/release/*.zip
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-windows-${{ matrix.arch }}
          path: |
            main/server/**/vcpkg-manifest-install.log
            main/server/**/CMakeError.log
          if-no-files-found: ignore

  macos-arm64:
    name: macOS (arm64)
    needs: webui
    # macOS 14 runner images retire on 2026-11-02 (actions/runner-images#13518).
    # The package keeps the macOS 14 minimum it had when built on macos-14;
    # vcpkg receives the same target through its clean build environment.
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      VCPKG_KEEP_ENV_VARS: MACOSX_DEPLOYMENT_TARGET
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Checkout onedice-cpp-lib (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf onedice-cpp-lib
            if git clone --depth 1 https://github.com/DiceZone/onedice-cpp-lib.git onedice-cpp-lib; then
              break
            fi
            echo "onedice-cpp-lib clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d onedice-cpp-lib/.git ] || { echo "onedice-cpp-lib clone failed after 3 attempts" >&2; exit 1; }
      - name: Checkout dicescript-c-lib (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf dicescript-c-lib
            if git clone --depth 1 https://github.com/DiceZone/dicescript-c-lib.git dicescript-c-lib; then
              break
            fi
            echo "dicescript-c-lib clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d dicescript-c-lib/.git ] || { echo "dicescript-c-lib clone failed after 3 attempts" >&2; exit 1; }
      - name: Checkout CatOfficial (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf CatOfficial
            if git clone --depth 1 https://github.com/DiceZone/CatOfficial.git CatOfficial; then
              break
            fi
            echo "CatOfficial clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d CatOfficial/.git ] || { echo "CatOfficial clone failed after 3 attempts" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: web/dist
      - name: Checkout docs (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf docs
            if git clone --depth 1 https://github.com/DiceZone/Dice-Next-Doc.git docs; then
              break
            fi
            echo "Dice-Next-Doc clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d docs/.git ] || { echo "Dice-Next-Doc clone failed after 3 attempts" >&2; exit 1; }
      - name: Prepare dependencies
        uses: ./main/.github/actions/setup-vcpkg
        with:
          triplet: arm64-osx
          baseline: ${{ env.VCPKG_BASELINE }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
      - name: Prepare macOS MCP test clients
        working-directory: main
        run: |
          node tools/check-node-version.mjs
          npm --prefix tools/mcp-interop ci --ignore-scripts
      - name: Configure release
        working-directory: main
        run: |
          cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DDICENEXT_MCP_INTEROP=ON -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=arm64-osx -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_INSTALLED_DIR="$VCPKG_ROOT/installed"
      - name: Compile release
        working-directory: main
        # Avoid recompiling all backend unit tests on the packaging runner.
        run: cmake --build server/build --target dice-next-server dice-next-launcher dice-next-mcp-probe --parallel "$(sysctl -n hw.ncpu)"
      - name: Test macOS MCP HTTP and official clients
        working-directory: main
        run: ctest --test-dir server/build --output-on-failure -R '^dice_next_mcp_(http|interop)$'
      - name: Verify Node.js security baseline
        working-directory: main
        shell: bash
        run: |
          node tools/check-node-version.mjs
          node --test tools/check-node-version.test.mjs
      - name: Test POSIX package manager
        working-directory: main
        run: |
          cmake --build server/build --target dice-next-update-test-core --parallel 2
          node tools/test-posix-manager.mjs server/build/dice-next server/build/dice-next-update-test-core
      - name: Package
        working-directory: main
        env:
          DICENEXT_WEB_ROOT: ${{ github.workspace }}/web
          DICENEXT_DOC_ROOT: ${{ github.workspace }}/docs
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          chmod +x cross-compile/scripts/package-macos.sh
          cross-compile/scripts/package-macos.sh
      - name: Test packaged WebUI HTTP
        timeout-minutes: 5
        working-directory: main
        run: node tools/test-webui-package.mjs release
      - uses: actions/upload-artifact@v4
        with:
          name: DiceNext-macos-arm64
          path: main/release/*.tar.gz
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-macos-arm64
          path: |
            main/server/**/vcpkg-manifest-install.log
            main/server/**/CMakeError.log
            main/server/build/Testing/Temporary/
          if-no-files-found: ignore

  android-signing:
    name: Check Android signing configuration
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - id: config
        env:
          HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        run: echo "enabled=$HAS_SIGNING" >> "$GITHUB_OUTPUT"

  android:
    name: Android (arm64)
    needs: [webui, android-signing]
    if: needs.android-signing.outputs.enabled == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VCPKG_KEEP_ENV_VARS: ANDROID_NDK_HOME;ANDROID_SDK_ROOT;ANDROID_HOME;JAVA_HOME
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Checkout sibling libraries
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          clone_repo() {
            local repo="$1" dest="$2" branch="${3:-}"
            for attempt in 1 2 3; do
              rm -rf "$dest"
              local args=(clone --depth 1 "https://github.com/DiceZone/${repo}.git" "$dest")
              if [ -n "$branch" ]; then args=(clone --depth 1 --branch "$branch" "https://github.com/DiceZone/${repo}.git" "$dest"); fi
              if git "${args[@]}"; then return 0; fi
              sleep 15
            done
            return 1
          }
          clone_repo onedice-cpp-lib onedice-cpp-lib
          clone_repo dicescript-c-lib dicescript-c-lib
          if [ "${{ github.ref_name }}" = android ]; then
            clone_repo CatOfficial CatOfficial android
          else
            clone_repo CatOfficial CatOfficial
          fi
          clone_repo Dice-Next-Doc docs
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: web/dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Export Android SDK/NDK
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git curl zip unzip tar pkg-config
      - name: Prepare dependencies
        uses: ./main/.github/actions/setup-vcpkg
        with:
          triplet: arm64-android
          baseline: ${{ env.VCPKG_BASELINE }}
      - name: Configure Android native library
        working-directory: main
        run: |
          cmake -S server -B server/build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/main/server/vcpkg-overlays/triplets" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$VCPKG_ROOT/installed" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON
      - name: Compile Android native library
        working-directory: main
        run: cmake --build server/build-android --target dice-next --parallel "$(nproc)"
      - name: Stage JNI, assets and assemble APK
        working-directory: main
        env:
          DICENEXT_WEB_ROOT: ${{ github.workspace }}/web
          DICENEXT_DOC_ROOT: ${{ github.workspace }}/docs
        run: |
          set -euo pipefail
          abi=arm64-v8a
          jni="android/app/src/main/jniLibs/${abi}"
          mkdir -p "$jni"
          so="$(find server/build-android -name 'libdice-next.so' | head -n1)"
          cp -f "$so" "$jni/libdice-next.so"
          wrap="$(find server/build-android -name 'libdnexecwrap.so' | head -n1)"
          [[ -n "$wrap" ]] || { echo "libdnexecwrap.so not found" >&2; exit 1; }
          cp -f "$wrap" "$jni/libdnexecwrap.so"
          stl="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -name 'libc++_shared.so' | grep aarch64-linux-android | head -n1 || true)"
          [[ -n "$stl" ]] && cp -f "$stl" "$jni/libc++_shared.so"
          strip="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -name 'llvm-strip' | head -n1 || true)"
          if [[ -n "$strip" ]]; then find "$jni" -name '*.so' -exec "$strip" --strip-unneeded {} \;; fi
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          chmod +x scripts/build-android.sh
          # Native already built; skip vcpkg/cmake by assembling assets + APK only.
          assets="android/app/src/main/assets"
          rm -rf "$assets"
          mkdir -p "$assets/web/dist"
          cp -a "$DICENEXT_WEB_ROOT/dist/." "$assets/web/dist/"
          cp -a server/i18n "$assets/i18n"
          cp -a server/resources/default-data/decks "$assets/decks"
          cp -a server/card-templates "$assets/card-templates"
          mkdir -p "$assets/data"
          cp -a server/resources/default-data/helpdoc "$assets/data/helpdoc"
          cp -a server/resources/default-data/plugins "$assets/data/plugins"
          if [[ -d server/resources/default-data/rules ]]; then
            mkdir -p "$assets/i18n/rules"
            cp -a server/resources/default-data/rules/. "$assets/i18n/rules/"
          fi
          cp -a server/resources/update-mirrors.json "$assets/update-mirrors.json"
          mkdir -p "$assets/docs"
          for doc in roadmap.md commands.json; do
            [[ -f "$DICENEXT_DOC_ROOT/$doc" ]] && cp -a "$DICENEXT_DOC_ROOT/$doc" "$assets/docs/$doc"
          done
          curl -fsSL "https://curl.se/ca/cacert.pem" -o "$assets/cacert.pem"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties
          chmod +x android/gradlew
      - name: Sign the release APK
        working-directory: main
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/dice-next-android.keystore"
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          export ANDROID_VERSION_NAME="$(sed -nE 's/project\(dice-next-server VERSION ([0-9.]+).*/\1/p' server/CMakeLists.txt)-beta.$(sed -nE 's/^int buildNumber\(\) \{ return ([0-9]+); \}/\1/p' server/build-android/generated/version_build.cpp)"
          (cd android && ./gradlew --no-daemon assembleRelease)
          mkdir -p release
          cp -f android/app/build/outputs/apk/release/app-release.apk release/DiceNext-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DiceNext-android-arm64
          path: main/release/DiceNext-android.apk
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-android-arm64
          path: |
            vcpkg/buildtrees/**/*.log
            main/server/build-android/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [webui, linux, windows, macos-arm64, android-signing, android, backend-tests]
    if: >-
      always() && !cancelled() && needs.webui.result == 'success' && needs.linux.result == 'success' &&
      needs.windows.result == 'success' && needs.macos-arm64.result == 'success' &&
      needs.backend-tests.result == 'success' && needs.android-signing.result == 'success' &&
      (needs.android.result == 'success' ||
      (needs.android.result == 'skipped' && needs.android-signing.outputs.enabled == 'false'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Calculate release build number
        id: build
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/project\(dice-next-server VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' server/CMakeLists.txt | head -n1)
          [[ -n "$version" ]] || { echo 'Cannot read server version' >&2; exit 1; }
          key=$(sed -nE 's/^([0-9]+\.[0-9]+)\..*/\1/p' <<< "$version")
          counter=$(tr -d '[:space:]' < server/build_counter.txt)
          build=1
          if [[ "$counter" =~ ^${key}:([0-9]+)$ ]]; then
            build=$((BASH_REMATCH[1] + 1))
          fi
          printf 'build=%s\n' "$build" >> "$GITHUB_OUTPUT"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
          printf 'base_counter=%s\n' "$counter" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s-beta.%s\n' "$version" "$build" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            [DiceNext-linux-amd64]='*.tar.gz'
            [DiceNext-linux-arm64]='*.tar.gz'
            [DiceNext-windows-amd64]='*.zip'
            [DiceNext-windows-arm64]='*.zip'
            [DiceNext-macos-arm64]='*.tar.gz'
          )
          if [[ '${{ needs.android.result }}' == success ]]; then expected[DiceNext-android-arm64]='*.apk'; fi
          for artifact in "${!expected[@]}"; do
            pattern="artifacts/${artifact}/${expected[$artifact]}"
            if ! compgen -G "$pattern" > /dev/null; then
              echo "::error::Missing release asset from ${artifact}: ${pattern}"
              exit 1
            fi
          done
          find artifacts -maxdepth 2 -type f -print
      - name: Generate integrity update manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          RELEASE_BUILD: ${{ steps.build.outputs.build }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/project\(dice-next-server VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' server/CMakeLists.txt | head -n1)
          [[ -n "$version" ]] || { echo 'Cannot read server version' >&2; exit 1; }

          assets='[]'
          add_asset() {
            local os="$1" arch="$2" artifact="$3" pattern="$4"
            shopt -s nullglob
            local files=(artifacts/"$artifact"/$pattern)
            shopt -u nullglob
            if [[ "${#files[@]}" -ne 1 ]]; then
              echo "Expected exactly one asset for $os-$arch, found ${#files[@]}" >&2
              exit 1
            fi
            local file="${files[0]}"
            local name sha size
            name=$(basename "$file")
            if [[ ! "$name" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Release asset name contains characters GitHub may rewrite: $name" >&2
              exit 1
            fi
            sha=$(sha256sum "$file" | awk '{print $1}')
            size=$(stat -c '%s' "$file")
            assets=$(jq -c \
              --arg os "$os" --arg arch "$arch" --arg name "$name" \
              --arg sha "$sha" --argjson size "$size" \
              '. + [{os:$os, arch:$arch, name:$name, sha256:$sha, size:$size}]' <<<"$assets")
          }

          add_asset windows amd64 DiceNext-windows-amd64 '*.zip'
          add_asset windows arm64 DiceNext-windows-arm64 '*.zip'
          add_asset linux amd64 DiceNext-linux-amd64 '*.tar.gz'
          add_asset linux arm64 DiceNext-linux-arm64 '*.tar.gz'
          add_asset macos arm64 DiceNext-macos-arm64 '*.tar.gz'
          if compgen -G 'artifacts/DiceNext-android-arm64/*.apk' > /dev/null; then
            add_asset android arm64 DiceNext-android-arm64 '*.apk'
          fi

          jq -n \
            --arg repository 'DiceZone/Dice-Next' \
            --arg tag "$RELEASE_TAG" \
            --arg version "$version" \
            --argjson build "$RELEASE_BUILD" \
            --arg published_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg release_url "https://github.com/DiceZone/Dice-Next/releases/tag/$RELEASE_TAG" \
            --argjson assets "$assets" \
            '{schema:1, repository:$repository, tag:$tag, version:$version, build:$build,
              prerelease:true, published_at:$published_at, release_url:$release_url,
              assets:($assets | map(select(.os != "android"))), android_assets:($assets | map(select(.os == "android")))}' > update-manifest.json
          jq -e '.schema == 1 and (.assets | length) == 5 and (.android_assets | length) <= 1' update-manifest.json >/dev/null
          cat update-manifest.json
      - name: Checkout the actual WebUI build source for release notes
        uses: actions/checkout@v4
        with:
          repository: DiceZone/Dice-Next-WebUI
          ref: ${{ needs.webui.outputs.source_sha }}
          path: release-webui
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.DICEZONE_CI_TOKEN || github.token }}
      - name: Generate categorized release notes and source record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SHA: ${{ github.sha }}
          WEBUI_SHA: ${{ needs.webui.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          # The counter checkout tracks main, which can move during a build.
          # Execute the generator actually covered by this run's source/tests.
          git show "$CORE_SHA":.github/scripts/release-notes.py > release-notes-generator.py
          python3 release-notes-generator.py \
            --core-path . --core-sha "$CORE_SHA" \
            --webui-path release-webui --webui-sha "$WEBUI_SHA" \
            --tag "$RELEASE_TAG" \
            --output release-notes.md --sources-output release-sources.json
          # Reuse the user-facing notes, without the full source/commit history.
          # Keep metadata bounded; mirror clients need no extra GitHub API call.
          jq --rawfile notes release-notes.md '.release_notes = ($notes | split("## 源码与完整比较")[0] | .[0:16000])' update-manifest.json > update-manifest-with-notes.json
          mv update-manifest-with-notes.json update-manifest.json
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record successful build number
        shell: bash
        env:
          BUILD_KEY: ${{ steps.build.outputs.key }}
          BUILD_NUMBER: ${{ steps.build.outputs.build }}
          BASE_COUNTER: ${{ steps.build.outputs.base_counter }}
        run: |
          set -euo pipefail
          desired_counter="${BUILD_KEY}:${BUILD_NUMBER}"
          printf '%s\n' "$desired_counter" > server/build_counter.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # .gitattributes routes the counter through a merge driver that keeps the
          # greatest value. The driver has to be registered in this checkout too, or
          # the rebase below falls back to a line-wise merge and conflicts every time
          # main moved while the platform builds were running.
          git config merge.dicenext-build-counter.name 'Dice!Next monotonic build counter'
          git config merge.dicenext-build-counter.driver             'cmake -DANCESTOR=%O -DCURRENT=%A -DINCOMING=%B -P server/cmake/merge_build_counter.cmake'
          git add server/build_counter.txt
          git commit -m "chore: record successful build ${BUILD_NUMBER}"

          # GitHub occasionally returns a transient HTTP 500 after all expensive
          # platform builds have completed. Retry the small counter push instead
          # of throwing away the whole release. Fetch between attempts so a
          # concurrent ordinary commit can be rebased safely.
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then
              echo "Recorded successful build ${BUILD_NUMBER}."
              exit 0
            fi

            if [ "$attempt" -eq 6 ]; then
              break
            fi

            delay=$((5 << (attempt - 1)))
            if [ "$delay" -gt 60 ]; then delay=60; fi
            echo "::warning::Build counter push failed (attempt ${attempt}/6); retrying in ${delay}s."
            sleep "$delay"

            if ! git fetch origin main:refs/remotes/origin/main; then
              echo "::warning::Could not refresh origin/main; the next push attempt will retry the connection."
              continue
            fi

            remote_counter=$(git show origin/main:server/build_counter.txt 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$remote_counter" = "$desired_counter" ]; then
              echo "Remote already contains build ${BUILD_NUMBER}; treating the previous push as successful."
              exit 0
            fi
            if [ "$remote_counter" != "$BASE_COUNTER" ]; then
              echo "::error::Remote build counter changed from '${BASE_COUNTER}' to '${remote_counter}' while this release was running. Refusing to overwrite it."
              exit 1
            fi

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Could not rebase the build counter commit onto the latest main branch."
              exit 1
            fi
          done

          echo "::error::Failed to record build ${BUILD_NUMBER} after 6 push attempts."
          exit 1
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            artifacts/DiceNext-linux-amd64/*.tar.gz
            artifacts/DiceNext-linux-arm64/*.tar.gz
            artifacts/DiceNext-windows-amd64/*.zip
            artifacts/DiceNext-windows-arm64/*.zip
            artifacts/DiceNext-macos-arm64/*.tar.gz
            artifacts/DiceNext-android-arm64/*.apk
            update-manifest.json
            release-sources.json
      - name: Refresh documentation release feed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DICEZONE_CI_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::warning::DICEZONE_CI_TOKEN is unavailable; the documentation schedule will refresh the release feed.'
            exit 0
          fi
          gh api --method POST repos/DiceZone/Dice-Next-Doc/dispatches -f event_type=release-published
