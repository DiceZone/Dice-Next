name: Release Dice!Next

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  # Keep the vcpkg executable aligned with server/vcpkg.json's builtin-baseline.
  VCPKG_BASELINE: '44819aa2a6c10e56065e2b0330e7d6c89d1d2574'

# Builds are serialized so a successful run can persist its number before the
# next run calculates its own number.
concurrency:
  group: dice-next-release
  cancel-in-progress: false

jobs:
  webui:
    name: WebUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: DiceZone/Dice-Next-WebUI
          path: web
          token: ${{ secrets.DICEZONE_CI_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build WebUI
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: web/dist
          if-no-files-found: error
  linux:
    name: Linux (${{ matrix.arch }})
    needs: webui
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            triplet: x64-linux-dynamic
            build_dir: build
          - arch: arm64
            runner: ubuntu-24.04-arm
            triplet: arm64-linux-dynamic
            build_dir: build-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Checkout onedice-cpp-lib (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf onedice-cpp-lib
            if git clone --depth 1 https://github.com/DiceZone/onedice-cpp-lib.git onedice-cpp-lib; then
              break
            fi
            echo "onedice-cpp-lib clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d onedice-cpp-lib/.git ] || { echo "onedice-cpp-lib clone failed after 3 attempts" >&2; exit 1; }
      - name: Checkout dicescript-c-lib (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf dicescript-c-lib
            if git clone --depth 1 https://github.com/DiceZone/dicescript-c-lib.git dicescript-c-lib; then
              break
            fi
            echo "dicescript-c-lib clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d dicescript-c-lib/.git ] || { echo "dicescript-c-lib clone failed after 3 attempts" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: web/dist
      - name: Checkout docs (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf docs
            if git clone --depth 1 https://github.com/DiceZone/Dice-Next-Doc.git docs; then
              break
            fi
            echo "Dice-Next-Doc clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d docs/.git ] || { echo "Dice-Next-Doc clone failed after 3 attempts" >&2; exit 1; }
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl zip unzip tar pkg-config libssl-dev libsqlite3-dev
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('main/server/vcpkg.json') }}
      - name: Build server
        working-directory: main
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
        run: |
          set -euo pipefail
          # 用系统工具从源码构建 vcpkg，避免下载预编译二进制（vcpkg-glibc 偶发网络失败）
          export VCPKG_FORCE_SYSTEM_BINARIES=1
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          if [ ! -d "$VCPKG_ROOT/.git" ]; then git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"; fi
          git -C "$VCPKG_ROOT" fetch --depth=1 origin "$VCPKG_BASELINE"
          git -C "$VCPKG_ROOT" checkout --detach "$VCPKG_BASELINE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          retry_count=0
          until "$VCPKG_ROOT/vcpkg" install --x-manifest-root=server --x-install-root="$VCPKG_ROOT/installed" --triplet=${{ matrix.triplet }}; do
            retry_count=$((retry_count + 1))
            if [ "$retry_count" -ge 3 ]; then
              echo "vcpkg install failed after 3 attempts" >&2
              exit 1
            fi
            echo "vcpkg install failed (attempt $retry_count), retrying in 15s" >&2
            sleep 15
          done
          cmake -S server -B server/${{ matrix.build_dir }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_INSTALLED_DIR="$VCPKG_ROOT/installed"
          cmake --build server/${{ matrix.build_dir }} --parallel "$(nproc)"
      - name: Package
        working-directory: main
        env:
          DICENEXT_WEB_ROOT: ${{ github.workspace }}/web
          DICENEXT_DOC_ROOT: ${{ github.workspace }}/docs
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          chmod +x cross-compile/scripts/package-linux.sh
          cross-compile/scripts/package-linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: DiceNext-linux-${{ matrix.arch }}
          path: main/release/*.tar.gz
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-linux-${{ matrix.arch }}
          path: |
            main/server/**/vcpkg-manifest-install.log
            main/server/**/CMakeError.log
          if-no-files-found: ignore

  windows:
    name: Windows (${{ matrix.arch }})
    needs: webui
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2022
            triplet: x64-windows
            build_dir: build
          - arch: arm64
            runner: windows-11-arm
            triplet: arm64-windows
            build_dir: build-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Checkout onedice-cpp-lib (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf onedice-cpp-lib
            if git clone --depth 1 https://github.com/DiceZone/onedice-cpp-lib.git onedice-cpp-lib; then
              break
            fi
            echo "onedice-cpp-lib clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d onedice-cpp-lib/.git ] || { echo "onedice-cpp-lib clone failed after 3 attempts" >&2; exit 1; }
      - name: Checkout dicescript-c-lib (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf dicescript-c-lib
            if git clone --depth 1 https://github.com/DiceZone/dicescript-c-lib.git dicescript-c-lib; then
              break
            fi
            echo "dicescript-c-lib clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d dicescript-c-lib/.git ] || { echo "dicescript-c-lib clone failed after 3 attempts" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: web/dist
      - name: Checkout docs (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf docs
            if git clone --depth 1 https://github.com/DiceZone/Dice-Next-Doc.git docs; then
              break
            fi
            echo "Dice-Next-Doc clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d docs/.git ] || { echo "Dice-Next-Doc clone failed after 3 attempts" >&2; exit 1; }

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('main/server/vcpkg.json') }}
      - name: Build server
        shell: pwsh
        working-directory: main
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:GITHUB_WORKSPACE 'vcpkg-cache'
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          if (-not (Test-Path (Join-Path $vcpkg '.git'))) { git clone https://github.com/microsoft/vcpkg.git $vcpkg }
          git -C $vcpkg fetch --depth 1 origin $env:VCPKG_BASELINE
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg baseline fetch failed' }
          git -C $vcpkg checkout --detach $env:VCPKG_BASELINE
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg baseline checkout failed' }
          $env:VCPKG_FORCE_SYSTEM_BINARIES = '1'   # 从源码构建，避免下载预编译二进制
          # Windows bootstrap must download vcpkg.exe; pre-fetch with robust retries (GitHub CDN is flaky).
          $vcpkgExe = Join-Path $vcpkg 'vcpkg.exe'
          if (-not (Test-Path $vcpkgExe)) {
            $vcpkgDownloadUrls = @(
              'https://github.com/microsoft/vcpkg-tool/releases/download/2026-05-27/vcpkg.exe',
              'https://github.com/microsoft/vcpkg-tool/releases/latest/download/vcpkg.exe'
            )
            $vcpkgDownloaded = $false
            foreach ($vcpkgUrl in $vcpkgDownloadUrls) {
              for ($attempt = 1; $attempt -le 8 -and -not $vcpkgDownloaded; $attempt++) {
                Write-Host "Downloading vcpkg.exe (attempt $attempt): $vcpkgUrl"
                & curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o $vcpkgExe $vcpkgUrl
                if ($LASTEXITCODE -eq 0 -and (Test-Path $vcpkgExe) -and ((Get-Item $vcpkgExe).Length -gt 1MB)) {
                  $vcpkgDownloaded = $true
                } else {
                  Remove-Item $vcpkgExe -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 10
                }
              }
            }
            if (-not $vcpkgDownloaded) { Write-Host 'pre-download vcpkg.exe failed, falling back to bootstrap download' }
          }
          $bootstrapAttempt = 0
          do {
            $bootstrapAttempt++
            & (Join-Path $vcpkg 'bootstrap-vcpkg.bat')
            if ($LASTEXITCODE -eq 0) { break }
            if ($bootstrapAttempt -ge 3) { throw 'vcpkg bootstrap failed' }
            Write-Host "vcpkg bootstrap failed (attempt $bootstrapAttempt), retrying in 15s"
            Start-Sleep -Seconds 15
          } while ($true)
          for ($vcpkgInstallAttempt = 1; $vcpkgInstallAttempt -le 3; $vcpkgInstallAttempt++) {
            & (Join-Path $vcpkg 'vcpkg.exe') install --x-manifest-root=server --x-install-root="$vcpkg/installed" --triplet=${{ matrix.triplet }}
            if ($LASTEXITCODE -eq 0) { break }
            if ($vcpkgInstallAttempt -lt 3) { Write-Host "vcpkg install failed (attempt $vcpkgInstallAttempt), retrying in 15s"; Start-Sleep -Seconds 15 }
          }
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg install failed' }
          cmake -S server -B server/${{ matrix.build_dir }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_INSTALLED_DIR="$vcpkg/installed"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build server/${{ matrix.build_dir }} --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
      - name: Package
        shell: pwsh
        working-directory: main
        env:
          DICENEXT_WEB_ROOT: ${{ github.workspace }}\web
          DICENEXT_DOC_ROOT: ${{ github.workspace }}\docs
        run: .\cross-compile\scripts\package-windows.ps1 -Architecture '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: DiceNext-windows-${{ matrix.arch }}
          path: main/release/*.zip
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-windows-${{ matrix.arch }}
          path: |
            main/server/**/vcpkg-manifest-install.log
            main/server/**/CMakeError.log
          if-no-files-found: ignore

  macos-arm64:
    name: macOS (arm64)
    needs: webui
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Checkout onedice-cpp-lib (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf onedice-cpp-lib
            if git clone --depth 1 https://github.com/DiceZone/onedice-cpp-lib.git onedice-cpp-lib; then
              break
            fi
            echo "onedice-cpp-lib clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d onedice-cpp-lib/.git ] || { echo "onedice-cpp-lib clone failed after 3 attempts" >&2; exit 1; }
      - name: Checkout dicescript-c-lib (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf dicescript-c-lib
            if git clone --depth 1 https://github.com/DiceZone/dicescript-c-lib.git dicescript-c-lib; then
              break
            fi
            echo "dicescript-c-lib clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d dicescript-c-lib/.git ] || { echo "dicescript-c-lib clone failed after 3 attempts" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: web/dist
      - name: Checkout docs (retry)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60
          for attempt in 1 2 3; do
            rm -rf docs
            if git clone --depth 1 https://github.com/DiceZone/Dice-Next-Doc.git docs; then
              break
            fi
            echo "Dice-Next-Doc clone failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          [ -d docs/.git ] || { echo "Dice-Next-Doc clone failed after 3 attempts" >&2; exit 1; }
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            vcpkg-cache
          key: vcpkg-${{ runner.os }}-arm64-osx-static-${{ env.VCPKG_BASELINE }}-${{ hashFiles('main/server/vcpkg.json') }}
      - name: Build server
        working-directory: main
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
        run: |
          set -euo pipefail
          # 用系统工具从源码构建 vcpkg，避免下载预编译二进制（vcpkg-glibc 偶发网络失败）
          export VCPKG_FORCE_SYSTEM_BINARIES=1
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          if [ ! -d "$VCPKG_ROOT/.git" ]; then git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"; fi
          git -C "$VCPKG_ROOT" fetch --depth=1 origin "$VCPKG_BASELINE"
          git -C "$VCPKG_ROOT" checkout --detach "$VCPKG_BASELINE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          retry_count=0
          until "$VCPKG_ROOT/vcpkg" install --x-manifest-root=server --x-install-root="$VCPKG_ROOT/installed" --triplet=arm64-osx; do
            retry_count=$((retry_count + 1))
            if [ "$retry_count" -ge 3 ]; then
              echo "vcpkg install failed after 3 attempts" >&2
              exit 1
            fi
            echo "vcpkg install failed (attempt $retry_count), retrying in 15s" >&2
            sleep 15
          done
          cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=arm64-osx -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_INSTALLED_DIR="$VCPKG_ROOT/installed"
          cmake --build server/build --parallel "$(sysctl -n hw.ncpu)"
      - name: Package
        working-directory: main
        env:
          DICENEXT_WEB_ROOT: ${{ github.workspace }}/web
          DICENEXT_DOC_ROOT: ${{ github.workspace }}/docs
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          chmod +x cross-compile/scripts/package-macos.sh
          cross-compile/scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DiceNext-macos-arm64
          path: main/release/*.tar.gz
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-macos-arm64
          path: |
            main/server/**/vcpkg-manifest-install.log
            main/server/**/CMakeError.log
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [linux, windows, macos-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Calculate release build number
        id: build
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/project\(dice-next-server VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' server/CMakeLists.txt | head -n1)
          [[ -n "$version" ]] || { echo 'Cannot read server version' >&2; exit 1; }
          key=$(sed -nE 's/^([0-9]+\.[0-9]+)\..*/\1/p' <<< "$version")
          counter=$(tr -d '[:space:]' < server/build_counter.txt)
          build=1
          if [[ "$counter" =~ ^${key}:([0-9]+)$ ]]; then
            build=$((BASH_REMATCH[1] + 1))
          fi
          printf 'build=%s\n' "$build" >> "$GITHUB_OUTPUT"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
          printf 'base_counter=%s\n' "$counter" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s-beta.%s\n' "$version" "$build" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            [DiceNext-linux-amd64]='*.tar.gz'
            [DiceNext-linux-arm64]='*.tar.gz'
            [DiceNext-windows-amd64]='*.zip'
            [DiceNext-windows-arm64]='*.zip'
            [DiceNext-macos-arm64]='*.tar.gz'
          )
          for artifact in "${!expected[@]}"; do
            pattern="artifacts/${artifact}/${expected[$artifact]}"
            if ! compgen -G "$pattern" > /dev/null; then
              echo "::warning::Missing release asset from ${artifact}: ${pattern}"
            fi
          done
          find artifacts -maxdepth 2 -type f -print
      - name: Record successful build number
        shell: bash
        env:
          BUILD_KEY: ${{ steps.build.outputs.key }}
          BUILD_NUMBER: ${{ steps.build.outputs.build }}
          BASE_COUNTER: ${{ steps.build.outputs.base_counter }}
        run: |
          set -euo pipefail
          desired_counter="${BUILD_KEY}:${BUILD_NUMBER}"
          printf '%s\n' "$desired_counter" > server/build_counter.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/build_counter.txt
          git commit -m "chore: record successful build ${BUILD_NUMBER}"

          # GitHub occasionally returns a transient HTTP 500 after all expensive
          # platform builds have completed. Retry the small counter push instead
          # of throwing away the whole release. Fetch between attempts so a
          # concurrent ordinary commit can be rebased safely.
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then
              echo "Recorded successful build ${BUILD_NUMBER}."
              exit 0
            fi

            if [ "$attempt" -eq 6 ]; then
              break
            fi

            delay=$((5 << (attempt - 1)))
            if [ "$delay" -gt 60 ]; then delay=60; fi
            echo "::warning::Build counter push failed (attempt ${attempt}/6); retrying in ${delay}s."
            sleep "$delay"

            if ! git fetch origin main:refs/remotes/origin/main; then
              echo "::warning::Could not refresh origin/main; the next push attempt will retry the connection."
              continue
            fi

            remote_counter=$(git show origin/main:server/build_counter.txt 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$remote_counter" = "$desired_counter" ]; then
              echo "Remote already contains build ${BUILD_NUMBER}; treating the previous push as successful."
              exit 0
            fi
            if [ "$remote_counter" != "$BASE_COUNTER" ]; then
              echo "::error::Remote build counter changed from '${BASE_COUNTER}' to '${remote_counter}' while this release was running. Refusing to overwrite it."
              exit 1
            fi

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Could not rebase the build counter commit onto the latest main branch."
              exit 1
            fi
          done

          echo "::error::Failed to record build ${BUILD_NUMBER} after 6 push attempts."
          exit 1
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/DiceNext-linux-amd64/*.tar.gz
            artifacts/DiceNext-linux-arm64/*.tar.gz
            artifacts/DiceNext-windows-amd64/*.zip
            artifacts/DiceNext-windows-arm64/*.zip
            artifacts/DiceNext-macos-arm64/*.tar.gz
