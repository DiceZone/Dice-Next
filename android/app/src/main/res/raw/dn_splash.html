<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Dice!Next</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0e1c;
      color: #f8fafc;
      font-family: system-ui, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    .dn-stage {
      position: absolute;
      inset: 0;
      overflow: visible;
      perspective: 720px;
    }
    .dn-bloom {
      position: absolute;
      top: -40%;
      right: -80%;
      bottom: -40%;
      left: -80%;
      background: radial-gradient(ellipse 34.6% 28.9% at 50% 33.3%, rgba(79, 70, 229, 0.42), rgba(10, 14, 28, 0) 72%);
      transform: scale(0.4);
      transform-origin: 50% 22.2%;
      opacity: 0;
      pointer-events: none;
    }
    .dn-particles {
      position: absolute;
      width: 0;
      height: 0;
      top: 33%;
      left: 50%;
      z-index: 2;
    }
    .dn-p {
      position: absolute;
      width: var(--s);
      height: var(--s);
      left: 0;
      top: 0;
      border-radius: 99px;
      background: #c7d2fe;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.2);
    }
    .dn-p.dn-pip {
      border-radius: 1px;
      background: #e2e8f0;
    }
    .dn-p.dn-hot { background: #a5b4fc; }
    .dn-dice-wrap {
      position: absolute;
      z-index: 3;
      top: 25%;
      left: 50%;
      translate: -50% 0;
      width: 28%;
      max-width: 104px;
      aspect-ratio: 164 / 146;
      overflow: visible;
      transform-style: preserve-3d;
    }
    .dn-dice {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      transform-style: preserve-3d;
    }
    .dn-face {
      opacity: 0;
      transform-origin: center;
      transform-box: fill-box;
    }
    .dn-copy {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 16%;
      z-index: 4;
      text-align: center;
    }
    .dn-word {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #f8fafc;
      transform: translateY(16px);
      opacity: 0;
    }
    .dn-bang { color: #4f46e5; }
    .dn-sub {
      margin: 8px 0 0;
      font-size: 13px;
      color: #94a3b8;
      transform: translateY(10px);
      opacity: 0;
    }
    .dn-spinner {
      display: block;
      width: 28px;
      height: 28px;
      margin: 18px auto 0;
      opacity: 0;
      transform: scale(0.86);
    }
    .dn-spinner svg { width: 100%; height: 100%; display: block; }
    .dn-play .dn-bloom {
      animation: dn-bloom 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .dn-play .dn-p {
      animation: dn-burst 0.9s var(--d) cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .dn-play .dn-face {
      animation: dn-assemble 0.52s var(--d) cubic-bezier(0.18, 0.82, 0.22, 1) both;
    }
    .dn-play .dn-word {
      animation: dn-rise 0.55s 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .dn-play .dn-sub {
      animation: dn-rise 0.5s 0.62s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .dn-play .dn-spinner {
      animation: dn-spin-in 0.4s 0.68s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .dn-play .dn-arc {
      transform-origin: 16px 16px;
      animation: dn-spin 0.85s 0.68s linear infinite;
    }
    @keyframes dn-bloom {
      from { opacity: 0; transform: scale(0.4); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes dn-burst {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.15); }
      22% { opacity: 1; }
      100% { opacity: 0.7; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1); }
    }
    @keyframes dn-assemble {
      0% {
        opacity: 0;
        filter: blur(12px);
        transform: translate3d(var(--ox), var(--oy), var(--oz)) scale3d(var(--sx), var(--sy), 1) scale(var(--sc));
      }
      58% { opacity: 1; filter: blur(3px); }
      100% {
        opacity: 1;
        filter: blur(0);
        transform: translate3d(0, 0, 0) scale3d(1, 1, 1) scale(1);
      }
    }
    @keyframes dn-rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes dn-spin-in {
      from { opacity: 0; transform: scale(0.86); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes dn-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .dn-bloom, .dn-face, .dn-word, .dn-sub, .dn-spinner, .dn-arc {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
      .dn-p {
        animation: none !important;
        opacity: 0.55 !important;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1) !important;
      }
    }
  </style>
</head>
<body>
  <div class="dn-stage dn-play">
    <div class="dn-bloom" aria-hidden="true"></div>
    <div class="dn-particles" aria-hidden="true">
      <span class="dn-p" style="--x:18px;--y:-86px;--s:3px;--d:.28s"></span>
      <span class="dn-p" style="--x:-52px;--y:-64px;--s:2px;--d:.32s"></span>
      <span class="dn-p" style="--x:64px;--y:-38px;--s:4px;--d:.22s"></span>
      <span class="dn-p" style="--x:-78px;--y:-8px;--s:2px;--d:.36s"></span>
      <span class="dn-p" style="--x:86px;--y:6px;--s:3px;--d:.26s"></span>
      <span class="dn-p" style="--x:-36px;--y:58px;--s:2px;--d:.4s"></span>
      <span class="dn-p" style="--x:44px;--y:72px;--s:3px;--d:.3s"></span>
      <span class="dn-p" style="--x:-8px;--y:88px;--s:2px;--d:.44s"></span>
      <span class="dn-p" style="--x:12px;--y:-48px;--s:5px;--d:.2s"></span>
      <span class="dn-p" style="--x:-62px;--y:28px;--s:3px;--d:.34s"></span>
      <span class="dn-p" style="--x:72px;--y:42px;--s:2px;--d:.38s"></span>
      <span class="dn-p" style="--x:-24px;--y:-92px;--s:2px;--d:.24s"></span>
      <span class="dn-p dn-pip" style="--x:38px;--y:-70px;--s:5px;--d:.28s"></span>
      <span class="dn-p dn-pip" style="--x:-70px;--y:-32px;--s:4px;--d:.34s"></span>
      <span class="dn-p dn-pip" style="--x:78px;--y:-12px;--s:4px;--d:.26s"></span>
      <span class="dn-p dn-pip" style="--x:-48px;--y:68px;--s:5px;--d:.42s"></span>
      <span class="dn-p dn-pip" style="--x:56px;--y:64px;--s:4px;--d:.32s"></span>
      <span class="dn-p dn-hot" style="--x:-14px;--y:-28px;--s:6px;--d:.18s"></span>
      <span class="dn-p dn-hot" style="--x:28px;--y:22px;--s:5px;--d:.22s"></span>
      <span class="dn-p dn-hot" style="--x:-40px;--y:12px;--s:4px;--d:.24s"></span>
      <span class="dn-p" style="--x:96px;--y:-54px;--s:2px;--d:.46s"></span>
      <span class="dn-p" style="--x:-96px;--y:18px;--s:2px;--d:.5s"></span>
      <span class="dn-p" style="--x:8px;--y:108px;--s:2px;--d:.48s"></span>
      <span class="dn-p" style="--x:-88px;--y:-72px;--s:2px;--d:.4s"></span>
      <span class="dn-p" style="--x:108px;--y:28px;--s:2px;--d:.52s"></span>
      <span class="dn-p" style="--x:-18px;--y:-110px;--s:3px;--d:.3s"></span>
    </div>
    <div class="dn-dice-wrap">
      <svg class="dn-dice" viewBox="0 0 164 146" preserveAspectRatio="xMidYMid meet" role="presentation">
        <g class="dn-face" style="--ox:-260px;--oy:-210px;--oz:40px;--sc:.55;--sx:2.3;--sy:.5;--d:0s"><polygon fill="#d8d8d8" points="21.88,58.14 0.22,68.50 33.30,11.46 21.88,58.14"/></g>
        <g class="dn-face" style="--ox:16px;--oy:-28px;--oz:460px;--sc:2.1;--sx:1;--sy:1;--d:.04s"><polygon fill="#efefef" points="96.13,18.98 29.85,55.37 42.19,4.90 42.20,4.88 96.13,18.98"/></g>
        <g class="dn-face" style="--ox:250px;--oy:200px;--oz:-60px;--sc:.4;--sx:2.1;--sy:.55;--d:.06s"><polygon fill="#262626" points="124.91,142.31 111.83,109.43 162.74,75.88 163.21,76.37 124.91,142.31"/></g>
        <g class="dn-face" style="--ox:-18px;--oy:280px;--oz:90px;--sc:.7;--sx:.55;--sy:2.2;--d:.02s"><polygon fill="#515151" points="118.19,144.61 44.09,144.59 105.61,113.00 118.19,144.61"/></g>
        <g class="dn-face" style="--ox:-280px;--oy:80px;--oz:20px;--sc:.45;--sx:2.4;--sy:.48;--d:.07s"><polygon fill="#828282" points="100.25,107.78 40.41,138.51 30.27,68.98 100.25,107.78"/></g>
        <g class="dn-face" style="--ox:-48px;--oy:18px;--oz:430px;--sc:1.9;--sx:1;--sy:1;--d:.01s"><polygon fill="#a0a0a0" points="32.22,131.37 0.00,75.62 22.52,64.87 32.22,131.37"/></g>
        <g class="dn-face" style="--ox:160px;--oy:-270px;--oz:-180px;--sc:.28;--sx:.7;--sy:2;--d:.05s"><polygon fill="#bcbcbc" points="102.41,100.81 32.74,62.19 104.07,23.00 102.41,100.81"/></g>
        <g class="dn-face" style="--ox:270px;--oy:-24px;--oz:70px;--sc:.6;--sx:2.3;--sy:.5;--d:.08s"><polygon fill="#6b6b6b" points="157.64,70.73 109.45,102.50 111.15,23.82 157.64,70.73"/></g>
        <g class="dn-face" style="--ox:36px;--oy:-64px;--oz:400px;--sc:1.75;--sx:1;--sy:1;--d:.03s"><polygon fill="#cccccc" points="160.16,63.09 111.14,13.64 125.06,2.43 160.16,63.09"/></g>
        <g class="dn-face" style="--ox:-220px;--oy:-250px;--oz:-90px;--sc:.32;--sx:1.8;--sy:1.5;--d:.05s"><polygon fill="#ededed" points="118.38,0.06 102.14,13.15 102.12,13.14 51.83,0.00 118.38,0.06"/></g>
      </svg>
    </div>
    <div class="dn-copy">
      <p class="dn-word">Dice<span class="dn-bang">!</span>Next</p>
      <p class="dn-sub" id="dn-status" role="status">正在启动…</p>
      <span class="dn-spinner" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <circle cx="16" cy="16" r="12" fill="none" stroke="#312e81" stroke-width="2.5"/>
          <circle class="dn-arc" cx="16" cy="16" r="12" fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="20 56"/>
        </svg>
      </span>
    </div>
  </div>
  <script>
    (function () {
      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var ms = reduced ? 300 : 1800;
      function ping() {
        try { Splash.onIntroDone(); } catch (e) {}
      }
      setTimeout(ping, ms);
    })();
  </script>
</body>
</html>
